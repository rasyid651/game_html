<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🥷 Ninja Fruit - Hand Tracking</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            cursor: none;
        }

        #gameCanvas {
            display: block;
        }

        #cameraVideo {
            display: none;
        }

        #webcamPreview {
            position: fixed;
            bottom: 10px;
            right: 10px;
            width: 200px;
            height: 150px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            z-index: 10;
            transform: scaleX(-1);
            object-fit: cover;
            opacity: 0.7;
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
        }

        #loading h1 {
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255, 100, 100, 0.8);
        }

        #loading p {
            font-size: 1.2em;
            opacity: 0.8;
            margin-bottom: 15px;
            text-align: center;
        }

        .loader {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid #ff6b6b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #errorScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
            padding: 20px;
        }

        #errorScreen h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            color: #ff6b6b;
        }

        #errorScreen .error-box {
            background: rgba(255, 107, 107, 0.1);
            border: 2px solid #ff6b6b;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            max-width: 600px;
            text-align: center;
        }

        #errorScreen .error-title {
            font-size: 1.5em;
            margin-bottom: 15px;
            color: #ff6b6b;
        }

        #errorScreen .error-message {
            line-height: 1.6;
            margin-bottom: 20px;
        }

        #errorScreen .solution {
            background: rgba(107, 203, 119, 0.1);
            border-left: 4px solid #6bcb77;
            padding: 15px;
            margin: 15px 0;
            text-align: left;
            border-radius: 5px;
        }

        #errorScreen .solution strong {
            color: #6bcb77;
            display: block;
            margin-bottom: 8px;
        }

        #errorScreen button {
            padding: 15px 35px;
            font-size: 1.1em;
            border: none;
            border-radius: 10px;
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s;
            font-weight: bold;
        }

        #errorScreen button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(238, 90, 36, 0.4);
        }

        #errorScreen button.secondary {
            background: linear-gradient(45deg, #4ecdc4, #44a3aa);
        }

        #startScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
        }

        #startScreen h1 {
            font-size: 4em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff6b6b, #ffd93d, #6bcb77);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #startScreen p {
            font-size: 1.2em;
            opacity: 0.7;
            margin-bottom: 40px;
            text-align: center;
        }

        #startBtn {
            padding: 15px 50px;
            font-size: 1.5em;
            border: none;
            border-radius: 50px;
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 20px rgba(238, 90, 36, 0.4);
        }

        #startBtn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 30px rgba(238, 90, 36, 0.6);
        }

        .info-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px 25px;
            border-radius: 10px;
            margin: 10px 0;
            border-left: 4px solid #ffd93d;
        }

        .protocol-ok {
            color: #6bcb77;
        }

        .protocol-warning {
            color: #ffd93d;
        }
    </style>
</head>
<body>
    <div id="loading">
        <h1>🥷 Ninja Fruit</h1>
        <p id="loadingText">Memuat game...</p>
        <p id="loadingSubtext" style="font-size: 0.9em; opacity: 0.6;"></p>
        <div class="loader"></div>
    </div>

    <div id="errorScreen">
        <h1>⚠️ Perhatian</h1>
        <div class="error-box">
            <div class="error-title" id="errorTitle">Akses Kamera Diperlukan</div>
            <div class="error-message" id="errorMessage"></div>
            
            <div class="solution">
                <strong>✅ Solusi:</strong>
                <div id="solutionText"></div>
            </div>

            <div class="info-box" id="protocolInfo"></div>
        </div>
        <button onclick="retryCamera()">📷 Izinkan Kamera & Mulai</button>
        <button class="secondary" onclick="startWithMouseMode()">🖱️ Mode Mouse (Alternatif)</button>
    </div>

    <div id="startScreen">
        <h1>🥷 Ninja Fruit</h1>
        <p>Gerakkan tangan Anda di depan kamera untuk memotong buah!</p>
        <button id="startBtn">🎮 MULAI</button>
    </div>

    <video id="cameraVideo" autoplay playsinline></video>
    <canvas id="gameCanvas"></canvas>
    <video id="webcamPreview" autoplay playsinline></video>

    <!-- Load MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.min.js"></script>

    <script>
    // ============================================
    // KONFIGURASI GAME
    // ============================================
    const CONFIG = {
        MAX_FRUITS: 6,
        SPAWN_INTERVAL: 1200,
        MIN_SPAWN_INTERVAL: 600,
        GRAVITY: 0.35,
        FRUIT_RADIUS: 35,
        SLICE_THRESHOLD: 30,
        SLICE_COOLDOWN: 50,
        BOMB_CHANCE: 0.12,
        COMBO_WINDOW: 800,
        MAX_LIVES: 3,
        PARTICLE_COUNT: 12,
        TRAIL_LENGTH: 15,
        DIFFICULTY_INCREASE: 0.02
    };

    const FRUIT_TYPES = [
        { name: '🍉', color: '#ff4757', innerColor: '#ff6b81', points: 1 },
        { name: '🍊', color: '#ff7f50', innerColor: '#ffa502', points: 1 },
        { name: '🍋', color: '#ffd32a', innerColor: '#fff200', points: 1 },
        { name: '🥝', color: '#8B4513', innerColor: '#7bed9f', points: 2 },
        { name: '🍎', color: '#e74c3c', innerColor: '#f39c12', points: 1 },
        { name: '🍑', color: '#ffb8b8', innerColor: '#ff6348', points: 2 },
        { name: '🍇', color: '#8854d0', innerColor: '#a55eea', points: 2 },
        { name: '🥥', color: '#dfe6e9', innerColor: '#f5f6fa', points: 3 },
        { name: '⭐', color: '#ffd32a', innerColor: '#fff200', points: 5 },
        { name: '💣', color: '#2d3436', innerColor: '#636e72', points: 0, isBomb: true }
    ];

    const GameState = { MENU: 0, PLAYING: 1, GAME_OVER: 2 };

    let canvas, ctx;
    let gameWidth, gameHeight;
    let gameState = GameState.MENU;
    let score = 0;
    let highScore = parseInt(localStorage.getItem('ninjaFruitHighScore') || '0');
    let lives = CONFIG.MAX_LIVES;
    let combo = 0;
    let comboTimer = null;
    let difficulty = 1;
    let fruits = [];
    let particles = [];
    let sliceTrail = [];
    let floatingTexts = [];
    let lastSpawnTime = 0;
    let lastSliceTime = 0;
    let isHandDetected = false;
    let prevHandPos = null;
    let handVelocity = { x: 0, y: 0 };
    let cameraReady = false;
    let handsModule = null;
    let cameraModule = null;
    let audioCtx = null;
    let cameraStream = null;

    // ============================================
    // INISIALISASI
    // ============================================
    function init() {
        canvas = document.getElementById('gameCanvas');
        ctx = canvas.getContext('2d');
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        } catch(e) {
            console.log('Audio not supported');
        }

        // Tampilkan start screen langsung
        document.getElementById('loading').style.display = 'none';
        document.getElementById('startScreen').style.display = 'flex';

        requestAnimationFrame(gameLoop);
    }

    function resizeCanvas() {
        gameWidth = window.innerWidth;
        gameHeight = window.innerHeight;
        canvas.width = gameWidth;
        canvas.height = gameHeight;
    }

    // ============================================
    // CAMERA SETUP - DIPANGGIL SAAT START
    // ============================================
    async function initCamera() {
        try {
            document.getElementById('loading').style.display = 'flex';
            document.getElementById('startScreen').style.display = 'none';
            updateLoadingText('Mengakses kamera...', 'Mohon izinkan akses kamera');

            const videoElement = document.getElementById('cameraVideo');
            const previewElement = document.getElementById('webcamPreview');

            // Request camera dengan konfigurasi yang lebih kompatibel
            cameraStream = await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: 'user',
                    width: { ideal: 640 },
                    height: { ideal: 480 }
                },
                audio: false
            });

            videoElement.srcObject = cameraStream;
            previewElement.srcObject = cameraStream;

            // Tunggu video ready
            await new Promise((resolve) => {
                videoElement.onloadedmetadata = () => {
                    videoElement.play().then(resolve).catch(resolve);
                };
                setTimeout(resolve, 2000); // Timeout 2 detik
            });

            updateLoadingText('Memuat AI...', 'Initializing MediaPipe Hands');

            // Inisialisasi MediaPipe Hands
            if (typeof Hands !== 'undefined') {
                handsModule = new Hands({
                    locateFile: (file) => {
                        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${file}`;
                    }
                });

                handsModule.setOptions({
                    maxNumHands: 1,
                    modelComplexity: 1,
                    minDetectionConfidence: 0.6,
                    minTrackingConfidence: 0.5
                });

                handsModule.onResults(onHandResults);

                if (typeof Camera !== 'undefined') {
                    cameraModule = new Camera(videoElement, {
                        onFrame: async () => {
                            if (handsModule) {
                                await handsModule.send({ image: videoElement });
                            }
                        },
                        width: 640,
                        height: 480
                    });

                    await cameraModule.start();
                }
            }

            cameraReady = true;
            updateLoadingText('Siap!', 'Klik MULAI untuk bermain');
            
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
                gameState = GameState.PLAYING;
                resetGame();
            }, 500);

        } catch (error) {
            console.error('Camera error:', error);
            showCameraError(error);
        }
    }

    function updateLoadingText(text, subtext) {
        document.getElementById('loadingText').textContent = text;
        document.getElementById('loadingSubtext').textContent = subtext;
    }

    function showCameraError(error) {
        document.getElementById('loading').style.display = 'none';
        const errorScreen = document.getElementById('errorScreen');
        errorScreen.style.display = 'flex';

        let errorMsg = '';
        let solution = '';
        let protocolInfo = '';

        const protocol = window.location.protocol;
        const hostname = window.location.hostname;

        // Info protokol
        if (protocol === 'https:' || hostname === 'localhost' || hostname === '127.0.0.1') {
            protocolInfo = `<span class="protocol-ok">✓ Protokol ${protocol === 'https:' ? 'HTTPS' : 'HTTP'} (${hostname}) - Diizinkan untuk kamera</span>`;
        } else {
            protocolInfo = `<span class="protocol-warning">⚠ Protokol ${protocol} - Kamera mungkin memerlukan HTTPS</span>`;
        }

        if (error.name === 'NotAllowedError' || error.name === 'PermissionDeniedError') {
            errorMsg = 'Anda menolak akses kamera. Game memerlukan kamera untuk mendeteksi gerakan tangan.';
            solution = `
                1. Klik ikon kamera/gembok di address bar browser<br>
                2. Izinkan akses kamera untuk website ini<br>
                3. Refresh halaman dan coba lagi
            `;
        } else if (error.name === 'NotFoundError' || error.name === 'DevicesNotFoundError') {
            errorMsg = 'Kamera tidak ditemukan di perangkat Anda.';
            solution = 'Pastikan perangkat memiliki kamera dan kamera berfungsi dengan baik.';
        } else if (error.name === 'NotReadableError' || error.name === 'TrackStartError') {
            errorMsg = 'Kamera sedang digunakan oleh aplikasi lain.';
            solution = 'Tutup aplikasi lain yang menggunakan kamera (Zoom, Meet, dll), lalu coba lagi.';
        } else if (error.name === 'OverconstrainedError') {
            errorMsg = 'Kamera tidak mendukung resolusi yang diminta.';
            solution = 'Kamera Anda akan menggunakan resolusi default yang tersedia.';
        } else {
            errorMsg = `Error: ${error.message}`;
            solution = 'Periksa koneksi internet dan pastikan browser Anda mendukung akses kamera.';
        }

        document.getElementById('errorTitle').textContent = 'Akses Kamera Diperlukan';
        document.getElementById('errorMessage').innerHTML = errorMsg;
        document.getElementById('solutionText').innerHTML = solution;
        document.getElementById('protocolInfo').innerHTML = protocolInfo;
    }

    function retryCamera() {
        initCamera();
    }

    function startWithMouseMode() {
        document.getElementById('errorScreen').style.display = 'none';
        document.getElementById('startScreen').style.display = 'flex';
        document.querySelector('#startScreen p').textContent = 
            '🖱️ Mode Mouse: Gerakkan mouse untuk memotong buah!';
        
        // Setup mouse tracking
        canvas.addEventListener('mousemove', handleMouseMove);
        canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
        
        startGame();
    }

    function handleMouseMove(e) {
        if (gameState !== GameState.PLAYING) return;
        
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        processMovement(x, y);
    }

    function handleTouchMove(e) {
        if (gameState !== GameState.PLAYING) return;
        e.preventDefault();
        
        const rect = canvas.getBoundingClientRect();
        const x = e.touches[0].clientX - rect.left;
        const y = e.touches[0].clientY - rect.top;
        
        processMovement(x, y);
    }

    function processMovement(x, y) {
        const currentTime = performance.now();
        
        if (prevHandPos) {
            const dt = (currentTime - prevHandPos.time) || 16;
            const vx = (x - prevHandPos.x) / dt * 16;
            const vy = (y - prevHandPos.y) / dt * 16;
            const speed = Math.sqrt(vx ** 2 + vy ** 2);
            
            if (speed > 5 && currentTime - lastSliceTime > CONFIG.SLICE_COOLDOWN) {
                checkSlice(x, y, vx, vy);
                lastSliceTime = currentTime;
            }
        }
        
        prevHandPos = { x, y, time: currentTime };
        
        sliceTrail.push({ x, y, time: currentTime, speed: 10 });
        if (sliceTrail.length > CONFIG.TRAIL_LENGTH) {
            sliceTrail.shift();
        }
    }

    // ============================================
    // MEDIAPIPE HAND TRACKING
    // ============================================
    function onHandResults(results) {
        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            isHandDetected = true;
            const landmarks = results.multiHandLandmarks[0];

            const indexTip = landmarks[8];
            const middleTip = landmarks[12];

            const x = (1 - indexTip.x) * gameWidth;
            const y = indexTip.y * gameHeight;

            const middleX = (1 - middleTip.x) * gameWidth;
            const middleY = middleTip.y * gameHeight;

            const avgX = (x + middleX) / 2;
            const avgY = (y + middleY) / 2;

            const currentTime = performance.now();

            if (prevHandPos) {
                const dt = (currentTime - (prevHandPos.time || 0)) || 16;
                handVelocity.x = (avgX - prevHandPos.x) / dt * 16;
                handVelocity.y = (avgY - prevHandPos.y) / dt * 16;

                const speed = Math.sqrt(handVelocity.x ** 2 + handVelocity.y ** 2);

                if (speed > 8 && currentTime - lastSliceTime > CONFIG.SLICE_COOLDOWN) {
                    checkSlice(avgX, avgY, handVelocity.x, handVelocity.y);
                    lastSliceTime = currentTime;
                }
            }

            prevHandPos = { x: avgX, y: avgY, time: currentTime };

            sliceTrail.push({
                x: avgX,
                y: avgY,
                time: currentTime,
                speed: Math.sqrt(handVelocity.x ** 2 + handVelocity.y ** 2)
            });

            if (sliceTrail.length > CONFIG.TRAIL_LENGTH) {
                sliceTrail.shift();
            }
        } else {
            isHandDetected = false;
            prevHandPos = null;
            sliceTrail = [];
        }
    }

    // ============================================
    // GAME LOGIC
    // ============================================
    function startGame() {
        document.getElementById('startScreen').style.display = 'none';
        gameState = GameState.PLAYING;
        resetGame();
    }

    function resetGame() {
        score = 0;
        lives = CONFIG.MAX_LIVES;
        combo = 0;
        difficulty = 1;
        fruits = [];
        particles = [];
        sliceTrail = [];
        floatingTexts = [];
        lastSpawnTime = performance.now();
        prevHandPos = null;
    }

    function gameOver() {
        gameState = GameState.GAME_OVER;
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('ninjaFruitHighScore', highScore.toString());
        }
        playSound('gameOver');
    }

    function spawnFruit() {
        const now = performance.now();
        const interval = Math.max(CONFIG.MIN_SPAWN_INTERVAL,
            CONFIG.SPAWN_INTERVAL - (difficulty - 1) * 200);

        if (now - lastSpawnTime < interval) return;
        if (fruits.length >= CONFIG.MAX_FRUITS + Math.floor(difficulty)) return;

        lastSpawnTime = now;

        const count = Math.min(
            Math.floor(Math.random() * 2) + 1 + Math.floor(difficulty * 0.5),
            4
        );

        for (let i = 0; i < count; i++) {
            const isBomb = Math.random() < CONFIG.BOMB_CHANCE;
            const typeIndex = isBomb ?
                FRUIT_TYPES.findIndex(f => f.isBomb) :
                Math.floor(Math.random() * (FRUIT_TYPES.length - 1));
            const fruitType = FRUIT_TYPES[typeIndex];

            const fruit = {
                id: Date.now() + i + Math.random(),
                x: gameWidth * 0.15 + Math.random() * (gameWidth * 0.7),
                y: gameHeight + 50,
                radius: CONFIG.FRUIT_RADIUS,
                type: fruitType,
                vx: (Math.random() - 0.5) * 6,
                vy: -(10 + Math.random() * 5 + difficulty * 0.5),
                gravity: CONFIG.GRAVITY + (Math.random() - 0.5) * 0.1,
                rotation: Math.random() * Math.PI * 2,
                rotationSpeed: (Math.random() - 0.5) * 0.15,
                sliced: false,
                slices: [],
                opacity: 1,
                scale: 1
            };

            fruits.push(fruit);
        }
    }

    function checkSlice(handX, handY, velX, velY) {
        for (let i = fruits.length - 1; i >= 0; i--) {
            const fruit = fruits[i];
            if (fruit.sliced) continue;

            const dx = handX - fruit.x;
            const dy = handY - fruit.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < fruit.radius * fruit.scale + 10) {
                sliceFruit(fruit, velX, velY);
            }
        }
    }

    function sliceFruit(fruit, velX, velY) {
        fruit.sliced = true;

        if (fruit.type.isBomb) {
            playSound('bomb');
            lives--;
            combo = 0;

            for (let i = 0; i < 30; i++) {
                particles.push(createParticle(
                    fruit.x, fruit.y,
                    '#ff0000', '#ff6600', '#ffcc00',
                    5, 8
                ));
            }

            if (lives <= 0) {
                gameOver();
            }
        } else {
            playSound('slice');

            const points = fruit.type.points * (combo > 2 ? combo : 1);
            score += points;

            if (combo > 0) {
                combo++;
                clearTimeout(comboTimer);
                comboTimer = setTimeout(() => { combo = 0; }, CONFIG.COMBO_WINDOW);
            } else {
                combo = 1;
                comboTimer = setTimeout(() => { combo = 0; }, CONFIG.COMBO_WINDOW);
            }

            floatingTexts.push({
                x: fruit.x,
                y: fruit.y - 20,
                text: `+${points}`,
                color: combo > 2 ? '#ffd700' : '#ffffff',
                size: combo > 2 ? 28 : 22,
                vy: -3,
                opacity: 1,
                life: 60
            });

            if (combo > 2) {
                floatingTexts.push({
                    x: fruit.x,
                    y: fruit.y - 50,
                    text: `🔥 COMBO x${combo}!`,
                    color: '#ff6b6b',
                    size: 24,
                    vy: -2,
                    opacity: 1,
                    life: 60
                });
            }

            for (let i = 0; i < CONFIG.PARTICLE_COUNT; i++) {
                particles.push(createParticle(
                    fruit.x, fruit.y,
                    fruit.type.color, fruit.type.innerColor,
                    3, 6
                ));
            }

            const angle = Math.atan2(-velY, velX);
            fruit.slices = [
                {
                    vx: Math.cos(angle + 0.5) * 4,
                    vy: Math.sin(angle + 0.5) * 4 - 2,
                    rotation: 0,
                    rotSpeed: 0.15
                },
                {
                    vx: Math.cos(angle - Math.PI + 0.5) * 4,
                    vy: Math.sin(angle - Math.PI + 0.5) * 4 - 2,
                    rotation: 0,
                    rotSpeed: -0.15
                }
            ];

            difficulty += CONFIG.DIFFICULTY_INCREASE;
        }
    }

    function createParticle(x, y, color1, color2, minSize, maxSize) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 6;
        return {
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 3,
            size: minSize + Math.random() * (maxSize - minSize),
            color: Math.random() > 0.5 ? color1 : color2,
            opacity: 1,
            life: 40 + Math.random() * 30,
            gravity: 0.15
        };
    }

    // ============================================
    // UPDATE & DRAW
    // ============================================
    let screenShake = { x: 0, y: 0, intensity: 0 };

    function update() {
        if (gameState !== GameState.PLAYING) return;

        spawnFruit();

        if (screenShake.intensity > 0) {
            screenShake.x = (Math.random() - 0.5) * screenShake.intensity;
            screenShake.y = (Math.random() - 0.5) * screenShake.intensity;
            screenShake.intensity *= 0.9;
            if (screenShake.intensity < 0.5) {
                screenShake.intensity = 0;
                screenShake.x = 0;
                screenShake.y = 0;
            }
        }

        for (let i = fruits.length - 1; i >= 0; i--) {
            const fruit = fruits[i];

            if (!fruit.sliced) {
                fruit.x += fruit.vx;
                fruit.y += fruit.vy;
                fruit.vy += fruit.gravity;
                fruit.rotation += fruit.rotationSpeed;
                fruit.scale = Math.min(1, fruit.scale + 0.05);

                if (fruit.y > gameHeight + 80) {
                    if (!fruit.type.isBomb) {
                        lives--;
                        playSound('miss');
                        if (lives <= 0) {
                            gameOver();
                        }
                    }
                    fruits.splice(i, 1);
                }

                if (fruit.x < -100 || fruit.x > gameWidth + 100) {
                    fruits.splice(i, 1);
                }
            } else {
                if (fruit.slices && fruit.slices.length > 0) {
                    for (const slice of fruit.slices) {
                        fruit.x += slice.vx;
                        fruit.y += slice.vy;
                        slice.vy += fruit.gravity * 0.8;
                        slice.rotation += slice.rotSpeed;
                    }
                    fruit.opacity -= 0.02;

                    if (fruit.opacity <= 0 || fruit.y > gameHeight + 100) {
                        fruits.splice(i, 1);
                    }
                } else {
                    fruits.splice(i, 1);
                }
            }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += p.gravity;
            p.vx *= 0.98;
            p.life--;
            p.opacity = p.life / 70;

            if (p.life <= 0) {
                particles.splice(i, 1);
            }
        }

        const currentTime = performance.now();
        sliceTrail = sliceTrail.filter(t => currentTime - t.time < 300);

        for (let i = floatingTexts.length - 1; i >= 0; i--) {
            const ft = floatingTexts[i];
            ft.y += ft.vy;
            ft.life--;
            ft.opacity = ft.life / 60;

            if (ft.life <= 0) {
                floatingTexts.splice(i, 1);
            }
        }
    }

    function draw() {
        ctx.save();
        ctx.translate(screenShake.x, screenShake.y);

        // Background
        const gradient = ctx.createRadialGradient(
            gameWidth / 2, gameHeight / 2, 0,
            gameWidth / 2, gameHeight / 2, gameWidth * 0.7
        );
        gradient.addColorStop(0, '#16213e');
        gradient.addColorStop(1, '#0f0f23');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, gameWidth, gameHeight);

        if (gameState === GameState.PLAYING || gameState === GameState.GAME_OVER) {
            // Draw fruits
            for (const fruit of fruits) {
                drawFruit(fruit);
            }

            // Draw particles
            for (const p of particles) {
                ctx.globalAlpha = p.opacity;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            // Draw trail
            drawSliceTrail();

            // Draw floating texts
            for (const ft of floatingTexts) {
                ctx.globalAlpha = ft.opacity;
                ctx.fillStyle = ft.color;
                ctx.font = `bold ${ft.size}px 'Segoe UI'`;
                ctx.textAlign = 'center';
                ctx.fillText(ft.text, ft.x, ft.y);
            }
            ctx.globalAlpha = 1;

            // Draw UI
            drawUI();

            // Draw cursor
            drawCursor();
        }

        if (gameState === GameState.GAME_OVER) {
            drawGameOver();
        }

        ctx.restore();
    }

    function drawFruit(fruit) {
        ctx.save();
        ctx.globalAlpha = fruit.opacity;

        if (!fruit.sliced) {
            ctx.translate(fruit.x, fruit.y);
            ctx.rotate(fruit.rotation);
            ctx.scale(fruit.scale, fruit.scale);

            ctx.beginPath();
            ctx.arc(0, 0, fruit.radius, 0, Math.PI * 2);
            ctx.fillStyle = fruit.type.color;
            ctx.fill();

            const grad = ctx.createRadialGradient(-5, -5, 0, 0, 0, fruit.radius);
            grad.addColorStop(0, 'rgba(255,255,255,0.3)');
            grad.addColorStop(1, 'rgba(0,0,0,0.2)');
            ctx.fillStyle = grad;
            ctx.fill();

            ctx.font = `${fruit.radius * 1.2}px serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(fruit.type.name, 0, 2);

            if (fruit.type.isBomb) {
                ctx.shadowColor = '#ff0000';
                ctx.shadowBlur = 15 + Math.sin(Date.now() * 0.01) * 5;
                ctx.beginPath();
                ctx.arc(0, 0, fruit.radius + 3, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(255, 0, 0, ${0.5 + Math.sin(Date.now() * 0.01) * 0.3})`;
                ctx.lineWidth = 2;
                ctx.stroke();
            }

        } else if (fruit.slices && fruit.slices.length > 0) {
            for (let s = 0; s < fruit.slices.length; s++) {
                const slice = fruit.slices[s];
                ctx.save();
                ctx.translate(fruit.x + slice.vx * s * 10, fruit.y + slice.vy * s * 10);
                ctx.rotate(slice.rotation + (s === 0 ? 0.3 : -0.3));

                ctx.beginPath();
                ctx.arc(0, 0, fruit.radius, s === 0 ? -Math.PI / 2 : Math.PI / 2,
                    s === 0 ? Math.PI / 2 : -Math.PI / 2);
                ctx.closePath();
                ctx.fillStyle = fruit.type.color;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(0, 0, fruit.radius * 0.7, s === 0 ? -Math.PI / 2 : Math.PI / 2,
                    s === 0 ? Math.PI / 2 : -Math.PI / 2);
                ctx.closePath();
                ctx.fillStyle = fruit.type.innerColor;
                ctx.fill();

                ctx.restore();
            }
        }

        ctx.restore();
    }

    function drawSliceTrail() {
        if (sliceTrail.length < 2) return;

        const now = performance.now();

        for (let i = 1; i < sliceTrail.length; i++) {
            const p0 = sliceTrail[i - 1];
            const p1 = sliceTrail[i];
            const age = (now - p1.time) / 300;
            const alpha = Math.max(0, 1 - age);

            ctx.beginPath();
            ctx.moveTo(p0.x, p0.y);
            ctx.lineTo(p1.x, p1.y);
            ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
            ctx.lineWidth = 3 + p1.speed * 0.1;
            ctx.lineCap = 'round';
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(p0.x, p0.y);
            ctx.lineTo(p1.x, p1.y);
            ctx.strokeStyle = `rgba(255, 107, 107, ${alpha * 0.5})`;
            ctx.lineWidth = 8 + p1.speed * 0.2;
            ctx.stroke();
        }

        if (sliceTrail.length > 0) {
            const last = sliceTrail[sliceTrail.length - 1];
            const glow = ctx.createRadialGradient(last.x, last.y, 0, last.x, last.y, 20);
            glow.addColorStop(0, 'rgba(255, 255, 255, 0.8)');
            glow.addColorStop(0.5, 'rgba(255, 107, 107, 0.3)');
            glow.addColorStop(1, 'rgba(255, 107, 107, 0)');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(last.x, last.y, 20, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function drawCursor() {
        if (sliceTrail.length === 0) return;

        const last = sliceTrail[sliceTrail.length - 1];

        ctx.beginPath();
        ctx.arc(last.x, last.y, 12, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(last.x, last.y, 12, 0, Math.PI * 2);
        ctx.strokeStyle = '#ff6b6b';
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    function drawUI() {
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 36px "Segoe UI"';
        ctx.textAlign = 'left';
        ctx.fillText(`🏆 ${score}`, 20, 50);

        ctx.font = '16px "Segoe UI"';
        ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
        ctx.fillText(`Best: ${highScore}`, 20, 75);

        if (combo > 1) {
            ctx.fillStyle = '#ffd700';
            ctx.font = `bold ${24 + combo * 2}px "Segoe UI"`;
            ctx.textAlign = 'center';
            ctx.fillText(`🔥 COMBO x${combo}`, gameWidth / 2, 50);
        }

        ctx.textAlign = 'right';
        for (let i = 0; i < CONFIG.MAX_LIVES; i++) {
            ctx.font = '30px serif';
            ctx.fillText(i < lives ? '❤️' : '🖤', gameWidth - 20 - i * 40, 50);
        }
    }

    function drawGameOver() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(0, 0, gameWidth, gameHeight);

        ctx.textAlign = 'center';
        ctx.fillStyle = '#ff6b6b';
        ctx.font = 'bold 60px "Segoe UI"';
        ctx.fillText('GAME OVER', gameWidth / 2, gameHeight / 2 - 80);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 40px "Segoe UI"';
        ctx.fillText(`Skor: ${score}`, gameWidth / 2, gameHeight / 2 - 20);

        if (score >= highScore) {
            ctx.fillStyle = '#ffd700';
            ctx.font = 'bold 28px "Segoe UI"';
            ctx.fillText('🎉 REKOR BARU! 🎉', gameWidth / 2, gameHeight / 2 + 25);
        }

        ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.font = '20px "Segoe UI"';
        ctx.fillText(`Best: ${highScore}`, gameWidth / 2, gameHeight / 2 + 65);

        ctx.fillStyle = '#ff6b6b';
        ctx.font = 'bold 22px "Segoe UI"';
        ctx.fillText('🔄 Refresh untuk main lagi', gameWidth / 2, gameHeight / 2 + 120);
    }

    function playSound(type) {
        if (!audioCtx) return;

        try {
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            switch (type) {
                case 'slice':
                    oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.1);
                    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.15);
                    break;
                case 'bomb':
                    oscillator.type = 'sawtooth';
                    oscillator.frequency.setValueAtTime(200, audioCtx.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.4);
                    gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.4);
                    break;
                case 'miss':
                    oscillator.frequency.setValueAtTime(300, audioCtx.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
                    gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.25);
                    break;
                case 'gameOver':
                    oscillator.type = 'sawtooth';
                    oscillator.frequency.setValueAtTime(400, audioCtx.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.8);
                    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 1);
                    break;
            }
        } catch (e) {
            console.log('Sound error:', e);
        }
    }

    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    // Event listeners
    document.getElementById('startBtn').addEventListener('click', initCamera);

    // Start
    window.addEventListener('load', init);
    </script>
