<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web 3D - Hand Control</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
    canvas { display: block; }

    /* Loading Screen */
    #loading {
      position: fixed; inset: 0;
      background: #0a0a1a;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 1000; transition: opacity 0.5s;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 60px; height: 60px;
      border: 4px solid rgba(100, 200, 255, 0.2);
      border-top-color: #64c8ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { color: #64c8ff; margin-top: 20px; font-size: 14px; }

    /* Video Preview (kiri bawah) */
    #video-preview {
      position: fixed; bottom: 20px; left: 20px;
      width: 240px; height: 180px;
      border-radius: 12px; overflow: hidden;
      border: 2px solid rgba(100, 200, 255, 0.4);
      z-index: 10; transform: scaleX(-1);
      box-shadow: 0 0 20px rgba(100, 200, 255, 0.2);
    }
    #video-preview video, #video-preview canvas {
      width: 100%; height: 100%; object-fit: cover;
    }

    /* Info Panel (kanan bawah) */
    #info-panel {
      position: fixed; bottom: 20px; right: 20px;
      background: rgba(10, 10, 30, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(100, 200, 255, 0.3);
      border-radius: 12px; padding: 16px;
      color: #c0d8f0; font-size: 13px;
      z-index: 10; min-width: 220px;
    }
    #info-panel h3 { color: #64c8ff; margin-bottom: 10px; font-size: 14px; }
    #info-panel .stat {
      display: flex; justify-content: space-between;
      padding: 4px 0; border-bottom: 1px solid rgba(100, 200, 255, 0.1);
    }
    #info-panel .stat span:first-child { color: #8899aa; }
    #info-panel .stat span:last-child { color: #64c8ff; font-weight: 600; }

    /* Gesture Badge */
    #gesture-badge {
      position: fixed; top: 20px; left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 10, 30, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(100, 200, 255, 0.3);
      border-radius: 30px; padding: 10px 24px;
      color: #64c8ff; font-size: 15px; font-weight: 600;
      z-index: 10; letter-spacing: 1px;
      transition: all 0.3s;
    }

    /* Instructions */
    #instructions {
      position: fixed; top: 70px; left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 10, 30, 0.7);
      border-radius: 10px; padding: 12px 20px;
      color: #8899aa; font-size: 12px;
      z-index: 10; text-align: center;
    }
  </style>
</head>
<body>

  <!-- Loading -->
  <div id="loading">
    <div class="spinner"></div>
    <p>Memuat model AI & kamera...</p>
  </div>

  <!-- Gesture Badge -->
  <div id="gesture-badge">🖐️ Tunjukkan Tangan</div>

  <!-- Instructions -->
  <div id="instructions">
    ☝️ 1 jari = Putar &nbsp;|&nbsp; ✌️ 2 jari = Zoom &nbsp;|&nbsp; 🤏 Cubit = Skala Objek &nbsp;|&nbsp; 🖐️ 5 jari = Reset
  </div>

  <!-- Video Preview -->
  <div id="video-preview">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="hand-canvas"></canvas>
  </div>

  <!-- Info Panel -->
  <div id="info-panel">
    <h3>📊 Hand Tracking Stats</h3>
    <div class="stat"><span>Hand Detected</span><span id="stat-hand">No</span></div>
    <div class="stat"><span>Fingers Up</span><span id="stat-fingers">-</span></div>
    <div class="stat"><span>Gesture</span><span id="stat-gesture">-</span></div>
    <div class="stat"><span>Hand X</span><span id="stat-x">-</span></div>
    <div class="stat"><span>Hand Y</span><span id="stat-y">-</span></div>
    <div class="stat"><span>Pinch Distance</span><span id="stat-pinch">-</span></div>
  </div>

  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- MediaPipe Hands -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

  <script>
    // ==========================================
    //  1. THREE.JS SCENE SETUP
    // ==========================================
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0a0a1a, 0.035);

    const camera3D = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 100);
    camera3D.position.set(0, 0, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.prepend(renderer.domElement);

    // --- Lights ---
    const ambientLight = new THREE.AmbientLight(0x334466, 0.6);
    scene.add(ambientLight);

    const pointLight1 = new THREE.PointLight(0x64c8ff, 2, 30);
    pointLight1.position.set(5, 5, 5);
    scene.add(pointLight1);

    const pointLight2 = new THREE.PointLight(0xff6496, 1.5, 30);
    pointLight2.position.set(-5, -3, 3);
    scene.add(pointLight2);

    const pointLight3 = new THREE.PointLight(0x64ff96, 1, 20);
    pointLight3.position.set(0, 5, -3);
    scene.add(pointLight3);

    // --- Central Object Group ---
    const mainGroup = new THREE.Group();
    scene.add(mainGroup);

    // Icosahedron utama
    const mainGeo = new THREE.IcosahedronGeometry(1.5, 1);
    const mainMat = new THREE.MeshPhysicalMaterial({
      color: 0x64c8ff,
      metalness: 0.3,
      roughness: 0.2,
      emissive: 0x1a3a5c,
      emissiveIntensity: 0.3,
      transparent: true,
      opacity: 0.85,
    });
    const mainMesh = new THREE.Mesh(mainGeo, mainMat);
    mainGroup.add(mainMesh);

    // Wireframe luar
    const wireGeo = new THREE.IcosahedronGeometry(1.8, 1);
    const wireMat = new THREE.MeshBasicMaterial({
      color: 0x64c8ff,
      wireframe: true,
      transparent: true,
      opacity: 0.15,
    });
    const wireMesh = new THREE.Mesh(wireGeo, wireMat);
    mainGroup.add(wireMesh);

    // --- Orbiting Objects ---
    const orbiters = [];
    const orbiterCount = 12;
    for (let i = 0; i < orbiterCount; i++) {
      const size = 0.1 + Math.random() * 0.2;
      const geo = new THREE.OctahedronGeometry(size, 0);
      const mat = new THREE.MeshPhysicalMaterial({
        color: new THREE.Color().setHSL(i / orbiterCount, 0.8, 0.6),
        metalness: 0.6,
        roughness: 0.1,
        emissive: new THREE.Color().setHSL(i / orbiterCount, 0.9, 0.2),
      });
      const mesh = new THREE.Mesh(geo, mat);
      const radius = 3 + Math.random() * 2;
      const speed = 0.2 + Math.random() * 0.5;
      const offset = Math.random() * Math.PI * 2;
      orbiters.push({ mesh, radius, speed, offset, tilt: Math.random() * Math.PI });
      mainGroup.add(mesh);
    }

    // --- Particle Ring ---
    const particleCount = 2000;
    const particleGeo = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const particleSizes = new Float32Array(particleCount);
    for (let i = 0; i < particleCount; i++) {
      const angle = Math.random() * Math.PI * 2;
      const r = 2.5 + Math.random() * 3;
      positions[i * 3] = Math.cos(angle) * r;
      positions[i * 3 + 1] = (Math.random() - 0.5) * 2;
      positions[i * 3 + 2] = Math.sin(angle) * r;
      particleSizes[i] = Math.random() * 3 + 1;
    }
    particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    particleGeo.setAttribute('size', new THREE.BufferAttribute(particleSizes, 1));

    const particleMat = new THREE.PointsMaterial({
      color: 0x64c8ff,
      size: 0.04,
      transparent: true,
      opacity: 0.6,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    });
    const particles = new THREE.Points(particleGeo, particleMat);
    mainGroup.add(particles);

    // --- Background Stars ---
    const starsGeo = new THREE.BufferGeometry();
    const starsPos = new Float32Array(1000 * 3);
    for (let i = 0; i < 1000; i++) {
      starsPos[i * 3] = (Math.random() - 0.5) * 80;
      starsPos[i * 3 + 1] = (Math.random() - 0.5) * 80;
      starsPos[i * 3 + 2] = (Math.random() - 0.5) * 80;
    }
    starsGeo.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
    const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.08, transparent: true, opacity: 0.5 });
    const stars = new THREE.Points(starsGeo, starsMat);
    scene.add(stars);

    // --- Grid Floor ---
    const gridHelper = new THREE.GridHelper(40, 40, 0x1a2a3a, 0x0d1520);
    gridHelper.position.y = -4;
    scene.add(gridHelper);

    // ==========================================
    //  2. STATE VARIABLES
    // ==========================================
    let handDetected = false;
    let handX = 0, handY = 0; // normalized -1 to 1
    let fingersUp = 0;
    let gesture = "None";
    let pinchDist = 1;

    // Smoothed values
    let targetRotY = 0, targetRotX = 0;
    let currentRotY = 0, currentRotX = 0;
    let targetScale = 1, currentScale = 1;
    let targetZoom = 8, currentZoom = 8;
    let targetEmissiveIntensity = 0.3;

    // ==========================================
    //  3. MEDIAPIPE HANDS SETUP
    // ==========================================
    const video = document.getElementById('webcam');
    const handCanvas = document.getElementById('hand-canvas');
    const handCtx = handCanvas.getContext('2d');

    function onResults(results) {
      // Draw hand landmarks on preview canvas
      handCanvas.width = video.videoWidth;
      handCanvas.height = video.videoHeight;
      handCtx.clearRect(0, 0, handCanvas.width, handCanvas.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        handDetected = true;
        const landmarks = results.multiHandLandmarks[0];

        // Draw landmarks
        drawConnectors(handCtx, landmarks, HAND_CONNECTIONS, {
          color: 'rgba(100, 200, 255, 0.6)', lineWidth: 2
        });
        drawLandmarks(handCtx, landmarks, {
          color: '#64c8ff', lineWidth: 1, radius: 3
        });

        // Get index finger tip for position control
        const indexTip = landmarks[8];
        const thumbTip = landmarks[4];
        const middleTip = landmarks[12];
        const ringTip = landmarks[16];
        const pinkyTip = landmarks[20];
        const wrist = landmarks[0];

        // Normalize hand position (-1 to 1), flip X for mirror
        handX = -(indexTip.x - 0.5) * 2;
        handY = -(indexTip.y - 0.5) * 2;

        // Count fingers up
        fingersUp = countFingers(landmarks);

        // Pinch distance (thumb to index)
        pinchDist = Math.sqrt(
          Math.pow(thumbTip.x - indexTip.x, 2) +
          Math.pow(thumbTip.y - indexTip.y, 2)
        );

        // Detect gesture
        gesture = detectGesture(fingersUp, pinchDist, landmarks);

        // Update UI
        document.getElementById('stat-hand').textContent = '✅ Yes';
        document.getElementById('stat-fingers').textContent = fingersUp;
        document.getElementById('stat-gesture').textContent = gesture;
        document.getElementById('stat-x').textContent = handX.toFixed(2);
        document.getElementById('stat-y').textContent = handY.toFixed(2);
        document.getElementById('stat-pinch').textContent = pinchDist.toFixed(3);

        // Update badge
        const badge = document.getElementById('gesture-badge');
        const gestureIcons = {
          'Rotate': '☝️', 'Zoom': '✌️', 'Scale': '🤏',
          'Reset': '🖐️', 'Point': '👆', 'None': '🖐️'
        };
        badge.textContent = `${gestureIcons[gesture] || '🖐️'} ${gesture}`;

      } else {
        handDetected = false;
        document.getElementById('stat-hand').textContent = '❌ No';
        document.getElementById('stat-fingers').textContent = '-';
        document.getElementById('stat-gesture').textContent = '-';
        document.getElementById('stat-x').textContent = '-';
        document.getElementById('stat-y').textContent = '-';
        document.getElementById('stat-pinch').textContent = '-';
        document.getElementById('gesture-badge').textContent = '🖐️ Tunjukkan Tangan';
      }
    }

    function countFingers(landmarks) {
      let count = 0;
      // Thumb: compare x of tip vs IP joint
      const thumbTip = landmarks[4];
      const thumbIP = landmarks[3];
      const wrist = landmarks[0];
      // Determine if thumb is extended based on hand orientation
      const isRightHand = landmarks[17].x > landmarks[5].x;
      if (isRightHand) {
        if (thumbTip.x < thumbIP.x) count++;
      } else {
        if (thumbTip.x > thumbIP.x) count++;
      }
      // Other fingers: tip y < PIP y (remember y increases downward)
      const fingerTips = [8, 12, 16, 20];
      const fingerPips = [6, 10, 14, 18];
      for (let i = 0; i < 4; i++) {
        if (landmarks[fingerTips[i]].y < landmarks[fingerPips[i]].y) count++;
      }
      return count;
    }

    function detectGesture(fingers, pinch, landmarks) {
      if (fingers === 0 && pinch < 0.05) return 'Scale';
      if (fingers === 1) return 'Rotate';
      if (fingers === 2) return 'Zoom';
      if (fingers >= 5) return 'Reset';
      if (fingers === 1 && landmarks) return 'Point';
      return 'None';
    }

    // Initialize MediaPipe Hands
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });
    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.5
    });
    hands.onResults(onResults);

    // ==========================================
    //  4. CAMERA SETUP
    // ==========================================
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: 320, height: 240 }
        });
        video.srcObject = stream;
        await video.play();

        const mpCamera = new Camera(video, {
          onFrame: async () => {
            await hands.send({ image: video });
          },
          width: 320,
          height: 240
        });
        await mpCamera.start();

        document.getElementById('loading').classList.add('hidden');
      } catch (err) {
        console.error('Camera error:', err);
        document.getElementById('loading').innerHTML = `
          <p style="color:#ff6496">⚠️ Gagal mengakses kamera</p>
          <p style="color:#8899aa;font-size:12px;margin-top:8px">${err.message}</p>
        `;
      }
    }

    // ==========================================
    //  5. ANIMATION LOOP
    // ==========================================
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      // --- Auto rotation (no hand) ---
      if (!handDetected) {
        targetRotY = t * 0.2;
        targetRotX = Math.sin(t * 0.15) * 0.3;
        targetScale = 1;
        targetZoom = 8;
      }

      // --- Hand-based control ---
      if (handDetected) {
        switch (gesture) {
          case 'Rotate':
          case 'Point':
            targetRotY += handX * 0.04;
            targetRotX += handY * 0.03;
            targetRotX = Math.max(-1.5, Math.min(1.5, targetRotX));
            targetEmissiveIntensity = 0.3 + Math.abs(handX) * 0.5;
            break;

          case 'Zoom':
            targetZoom = 8 - handY * 4;
            targetZoom = Math.max(3, Math.min(15, targetZoom));
            break;

          case 'Scale':
            targetScale = 1 + (0.15 - pinchDist) * 5;
            targetScale = Math.max(0.3, Math.min(3, targetScale));
            mainMat.emissiveIntensity = 0.3 + (1 - pinchDist) * 2;
            break;

          case 'Reset':
            targetRotY *= 0.95;
            targetRotX *= 0.95;
            targetScale += (1 - targetScale) * 0.05;
            targetZoom += (8 - targetZoom) * 0.05;
            mainMat.emissiveIntensity = 0.3;
            break;
        }
      }

      // Smooth interpolation
      const smooth = 0.08;
      currentRotY += (targetRotY - currentRotY) * smooth;
      currentRotX += (targetRotX - currentRotX) * smooth;
      currentScale += (targetScale - currentScale) * smooth;
      currentZoom += (targetZoom - currentZoom) * smooth;

      // Apply transforms
      mainGroup.rotation.y = currentRotY;
      mainGroup.rotation.x = currentRotX;
      mainGroup.scale.setScalar(currentScale);
      camera3D.position.z = currentZoom;

      // Animate main mesh
      mainMesh.rotation.y = t * 0.3;
      mainMesh.rotation.x = Math.sin(t * 0.5) * 0.2;
      wireMesh.rotation.y = -t * 0.2;
      wireMesh.rotation.z = Math.sin(t * 0.3) * 0.3;

      // Animate orbiters
      orbiters.forEach((o, i) => {
        const angle = t * o.speed + o.offset;
        o.mesh.position.x = Math.cos(angle) * o.radius;
        o.mesh.position.z = Math.sin(angle) * o.radius;
        o.mesh.position.y = Math.sin(angle * 0.7 + o.tilt) * 1.5;
        o.mesh.rotation.x = t * 2;
        o.mesh.rotation.y = t * 1.5;
      });

      // Rotate particles
      particles.rotation.y = t * 0.1;

      // Animate stars
      stars.rotation.y = t * 0.01;
      stars.rotation.x = t * 0.005;

      // Move lights
      pointLight1.position.x = Math.sin(t * 0.5) * 6;
      pointLight1.position.z = Math.cos(t * 0.5) * 6;
      pointLight2.position.x = Math.cos(t * 0.3) * 5;
      pointLight2.position.y = Math.sin(t * 0.4) * 4;

      renderer.render(scene, camera3D);
    }

    // ==========================================
    //  6. RESIZE HANDLER
    // ==========================================
    window.addEventListener('resize', () => {
      camera3D.aspect = innerWidth / innerHeight;
      camera3D.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // ==========================================
    //  7. START EVERYTHING
    // ==========================================
    startCamera();
    animate();
  </script>
</body>
</html>
